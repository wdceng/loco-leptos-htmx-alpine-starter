# How e2e/run.sh runs the browser tests (cargo-nextest, docs/prerequisites.md).

[profile.default]
# A lane runs the browser tests alone (tests/main.rs): the harness's own
# unit tests need no browser, and counted in every lane they'd make its
# "passed" too high. They run with
# `cargo test --manifest-path e2e/Cargo.toml --lib`.
default-filter = "kind(test)"
# One test at a time in a lane: Safari allows one session, the memory
# tests measure with nothing else in the browser, and every test of a lane
# shares its site.
test-threads = 1
# A failure tried once more; one that then passes is reported FLAKY, not
# passed, so the summary still shows it.
retries = 1
fail-fast = false
# The harness stops a test at three minutes (src/session.rs, `TEST_WITHIN`)
# and keeps what the page showed; this ends the process should even that
# hang.
slow-timeout = { period = "60s", terminate-after = 5 }
# The run's end lists what failed and what was flaky.
final-status-level = "flaky"

# A JUnit report of the run, each attempt with its output, for any viewer,
# in target/e2e/nextest/<lane>/junit.xml: a profile a lane (below), so the
# lanes running side by side each write their own.
[profile.default.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

# A lane's profile, the default's in all but the report's folder.
[profile.chrome]
inherits = "default"
[profile.edge]
inherits = "default"
[profile.firefox]
inherits = "default"
[profile.safari]
inherits = "default"
# The low bar's (e2e/run.sh).
[profile.chrome-low]
inherits = "default"
[profile.firefox-low]
inherits = "default"
