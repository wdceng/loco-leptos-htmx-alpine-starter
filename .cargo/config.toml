[alias]
loco = "run --"
loco-tool = "run --"

playground = "run --example playground"

# The two-week rule held by cargo itself (stable since 1.100, Cargo's own
# changelog): the resolver passes over a crate version under 14 days old
# unless Cargo.lock holds it and the update leaves it locked, in the app's
# and the browser tests' workspaces too, which read this file from below.
# A security fix taken at once lifts it on its one command:
# `CARGO_REGISTRY_GLOBAL_MIN_PUBLISH_AGE=0 cargo update -p <crate> --precise <version>`;
# a full `cargo update` fails until that fix is two weeks old.
[registry]
global-min-publish-age = "14 days"

[env]
# Leptos picks the wasm file name at compile time from this variable: with it
# set the page loads `app.wasm`, which is what cargo-leptos writes; without
# it the page asks for `app_bg.wasm`, which never exists. cargo-leptos sets
# the variable during its own builds; this keeps a plain `cargo loco start`
# or `cargo test` build consistent with it. Must match `output-name` in
# [package.metadata.leptos].
LEPTOS_OUTPUT_NAME = "app"

# The app's queries (`sqlx::query!`) are checked against the committed
# .sqlx/ cache, never a live database: no connection on every rebuild, and
# the same answer on every machine, in CI and in the server build. Not
# `force`d, so `cargo sqlx prepare` (which sets SQLX_OFFLINE=false itself)
# and a `SQLX_OFFLINE=false cargo check` still reach the database.
SQLX_OFFLINE = "true"

# https://github.com/rust-lang/rust/issues/141626
# (can be removed once link.exe is fixed)
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
