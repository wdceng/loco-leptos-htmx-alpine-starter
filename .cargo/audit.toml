[advisories]
ignore = [
  # `paste` (via leptos -> either_of): an unmaintained compile-time proc-macro
  # helper, nothing of it reaches the binary or the wasm bundle. Only a Leptos
  # release can replace it; re-check after each `leptos` upgrade.
  "RUSTSEC-2024-0436",
  # `libsqlite3-sys` 0.37.0 (via sqlx-sqlite 0.9.0): its bundled SQLite
  # 3.51.3 can return stale memory when it opens a database beside a crafted
  # `-wal` of another page size. The app opens only its own database, which
  # only it writes. sqlx-sqlite 0.9.0 takes `libsqlite3-sys` below 0.38 and
  # the fix is 0.39; re-check after each `sqlx` release.
  "RUSTSEC-2026-0459",
]
